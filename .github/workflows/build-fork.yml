# Fork build for tabletsyourmpm-cpu/windows
# Adapted from dockur/windows .github/workflows/build.yml (2026-10-19).
# Differences from upstream: Docker Hub push, GitHub release, version bump,
# GitLab mirror, and mail steps removed (all need secrets/vars he doesn't have).
# Only pushes ghcr.io/tabletsyourmpm-cpu/windows:latest to GHCR.
# Trigger: MANUAL ONLY (workflow_dispatch) — nothing runs until he clicks "Run workflow".

name: Build fork image

on:
  workflow_dispatch:

concurrency:
  group: fork-build
  cancel-in-progress: false

jobs:
  shellcheck:
    name: Test
    uses: ./.github/workflows/check.yml

  build:
    name: Build
    needs: shellcheck
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: false
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/tabletsyourmpm-cpu/windows:latest
          # NOTE: image name is literal, not ${{ github.repository }}, so it can
          # never accidentally push to the wrong registry path.

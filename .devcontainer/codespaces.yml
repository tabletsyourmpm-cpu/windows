services:
  windows:
    container_name: windows
    image: ghcr.io/tabletsyourmpm-cpu/windows
    environment:
      RAM_SIZE: "half"
      DISK_SIZE: "max"
      CPU_CORES: "max"
      DISK_MINIMUM: "1G"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006
      - 3389:3389/tcp
      - 3389:3389/udp
    volumes:
      - ./windows:/storage
    restart: on-failure
    stop_grace_period: 2m

  # Guacamole RDP gateway — speedier alternative to noVNC.
  # Port 8081. 24-bit color, all desktop effects, full admin access.
  guacd:
    container_name: guacd
    image: guacamole/guacd:1.6.0
    restart: on-failure

  guacamole:
    container_name: guacamole
    image: guacamole/guacamole:1.6.0
    depends_on:
      - guacd
      - windows
    environment:
      GUACD_HOSTNAME: guacd
      GUACD_PORT: "4822"
    ports:
      - 8081:8080
    volumes:
      - ./guacamole/guacamole.properties:/etc/guacamole/guacamole.properties:ro
      - ./guacamole/user-mapping.xml:/etc/guacamole/user-mapping.xml:ro
      - ./guacamole/extensions:/etc/guacamole/extensions:ro
    restart: on-failure

# Guacamole configuration for the Windows VM gateway (port 8081).
# Faster than noVNC: RDP with 24-bit color and full desktop effects.

guacd-hostname: guacd
guacd-port: 4822

# XML auth: users and the Windows Desktop RDP connection
auth-provider: net.sourceforge.guacamole.net.basic.BasicFileAuthenticationProvider
basic-user-mapping: /etc/guacamole/user-mapping.xml
